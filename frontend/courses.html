<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AJV CollegeConnect • Courses</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#183b70;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.wrap{padding:24px;max-width:1200px;margin:auto}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 16px #00000012}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:600;font-size:14px}input,select,textarea{padding:10px;border:1px solid #ccd5e2;border-radius:7px;font-size:14px;width:100%}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;background:#2463c5;color:#fff;font-weight:600}button.secondary{background:#64748b}button.danger{background:#c0392b}button.warn{background:#b7791f}.actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;margin-bottom:15px}.toolbar input{max-width:360px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e9f0;text-align:left;white-space:nowrap}th{background:#eef3f9}.badge{padding:5px 9px;border-radius:20px;font-size:12px}.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#991b1b}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:8px 10px;border-radius:6px;background:#ffffff18}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;border-radius:12px;padding:22px;width:min(760px,100%);max-height:90vh;overflow:auto}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#183b70,#4f7cc3)}.login-box{background:#fff;padding:30px;border-radius:14px;width:min(430px,92%)}.login-box h1{margin-top:0}.login-box .field{margin:12px 0}.msg{min-height:20px;color:#b91c1c}.stat{font-size:28px;font-weight:700}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:800px){.grid,.quick{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.quick{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style><link rel="stylesheet" href="assets/srit-theme.css"><link rel="stylesheet" href="assets/professional-ui.css"></head>
<body><header class="top"><img class="brand-logo" src="assets/srit-logo.png" alt="AJV" style="display:none"><h1>Course Management</h1><div class="nav"><a href="admin-dashboard.html">Dashboard</a><a href="students.html">Students</a><a href="faculty.html">Faculty</a><a href="departments.html">Departments</a><a href="academic-management.html">Academic</a><a href="assign-students.html">Assign Students</a></div></header><main class="wrap"><section class="card"><div class="toolbar"><input id="search" placeholder="Search courses..." oninput="render()"><button class="secondary" onclick="openForm()">Add Course</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Code</th><th>Name</th><th>Department</th><th>Semester</th><th>Credits</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="modal" id="modal"><div class="modal-box"><h2 id="title">Add Course</h2><form id="form"><div class="grid"><div class="field"><label>Course Code *</label><input id="code" required></div><div class="field"><label>Course Name *</label><input id="name" required></div><div class="field"><label>Department *</label><select id="departmentId" required></select></div><div class="field"><label>Semester *</label><input id="semester" type="number" min="1" max="8" required></div><div class="field"><label>Credits *</label><input id="credits" type="number" min="0.5" max="9.9" step="0.1" required></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div></div><div class="actions"><button>Save</button><button type="button" class="secondary" onclick="closeForm()">Cancel</button></div></form></div></div></main><script>const API=(location.protocol === "file:" ? "http://localhost:5000" : location.origin),token=localStorage.getItem("collegeConnectToken"),u=localStorage.getItem("collegeConnectUser");let courses=[],editId=null;
let currentUser;try{currentUser=u?JSON.parse(u):null}catch{currentUser=null}
if(!token||!currentUser||currentUser.role!=="ADMIN"){localStorage.clear();location.href="index.html"}
async function req(p,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};const r=await fetch(API+p,o);const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch(_){d={message:raw||`Server returned ${r.status} without JSON`}};if(r.status===401||r.status===403){localStorage.clear();location.href="index.html"}if(!r.ok)throw Error(d.message||"Request failed");return d}
async function loadDepts(){const d=await req("/api/departments");departmentId.innerHTML='<option value="">Select</option>'+d.departments.filter(x=>Boolean(x.is_active)).map(x=>`<option value="${x.department_id}">${esc(x.department_code)} - ${esc(x.department_name)}</option>`).join("")}
async function load(){const d=await req("/api/courses");courses=d.courses;render()}function render(){const q=search.value.trim().toLowerCase();rows.innerHTML=courses.filter(c=>[c.course_code,c.course_name,c.department_name].some(v=>String(v).toLowerCase().includes(q))).map(c=>`<tr><td>${c.course_id}</td><td>${esc(c.course_code)}</td><td>${esc(c.course_name)}</td><td>${esc(c.department_name)}</td><td>${c.semester}</td><td>${c.credits}</td><td><div class="actions"><button onclick="edit(${c.course_id})">Edit</button><button class="danger" onclick="del(${c.course_id})">Delete</button></div></td></tr>`).join("")}
function openForm(){editId=null;title.textContent="Add Course";form.reset();code.disabled=false;modal.classList.add("show")}function closeForm(){modal.classList.remove("show")}
async function edit(id){const d=await req("/api/courses/"+id),c=d.course;editId=id;title.textContent="Edit Course";code.value=c.course_code;code.disabled=true;name.value=c.course_name;departmentId.value=c.department_id;semester.value=c.semester;credits.value=c.credits;description.value=c.description||"";modal.classList.add("show")}
form.addEventListener("submit",async e=>{e.preventDefault();try{const d={courseCode:code.value.trim(),courseName:name.value.trim(),departmentId:Number(departmentId.value),semester:Number(semester.value),credits:Number(credits.value),description:description.value.trim()};if(editId){await req("/api/courses/"+editId,{method:"PUT",body:JSON.stringify(d)})}else await req("/api/courses",{method:"POST",body:JSON.stringify(d)});closeForm();load();}catch(e){alert(e.message)}})
async function del(id){if(!confirm("Delete this course?"))return;try{await req("/api/courses/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}loadDepts();load();</script></body></html>
