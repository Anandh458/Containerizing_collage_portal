<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AJV CollegeConnect • Departments</title><link rel="stylesheet" href="assets/srit-theme.css"><style>.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;max-width:420px}.table-wrap{overflow:auto}.empty-row{text-align:center;color:#66746f;padding:28px}.error-banner{display:none;margin-bottom:16px;padding:12px 14px;border-radius:10px;background:#fdecec;color:#9b1c1c}.error-banner.show{display:block}</style><link rel="stylesheet" href="assets/professional-ui.css"></head>
<body>
<header class="top"><div><h1>Department Management</h1><small>AJV • Administrator</small></div><div class="nav"><a href="admin-dashboard.html">Dashboard</a><a href="students.html">Students</a><a href="faculty.html">Faculty</a><a href="courses.html">Courses</a><a href="academic-management.html">Academic</a><a href="assign-students.html">Assign Students</a></div></header>
<main class="wrap"><section id="errorBanner" class="error-banner"></section><section class="card"><div class="toolbar"><input id="search" placeholder="Search department code or name..."><button onclick="loadDepartments()">Search</button><button class="secondary" onclick="openForm()">Add Department</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Code</th><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="modal" id="modal"><div class="modal-box"><h2 id="title">Add Department</h2><form id="form"><div class="grid"><div class="field"><label>Department Code *</label><input id="code" maxlength="20" required></div><div class="field"><label>Department Name *</label><input id="name" maxlength="150" required></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div></div><div class="actions" style="margin-top:15px"><button>Save Department</button><button type="button" class="secondary" onclick="closeForm()">Cancel</button></div></form></div></div></main>
<script>
const API=(location.protocol === "file:" ? "http://localhost:5000" : location.origin);const token=localStorage.getItem("collegeConnectToken");const stored=localStorage.getItem("collegeConnectUser");let editId=null;
function authOk(){if(!token||!stored){location.href="index.html";return false}try{if(JSON.parse(stored).role!=="ADMIN")throw 0}catch{localStorage.clear();location.href="index.html";return false}return true}
async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"}});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={message:raw||`Server returned ${r.status} without JSON`}}if(r.status===401||r.status===403){localStorage.clear();location.href="index.html";return}if(!r.ok)throw Error(d.message||"Request failed");return d}
function err(msg){const e=document.getElementById("errorBanner");e.textContent=msg;e.classList.add("show")}function clearErr(){document.getElementById("errorBanner").classList.remove("show")}
async function loadDepartments(){clearErr();try{const q=document.getElementById("search").value.trim(),d=await req(q?"/api/departments/search?q="+encodeURIComponent(q):"/api/departments"),items=d.departments||[];document.getElementById("rows").innerHTML=items.length?items.map(x=>`<tr><td>${x.department_id}</td><td>${esc(x.department_code)}</td><td>${esc(x.department_name)}</td><td>${esc(x.description||"—")}</td><td><span class="badge ${x.is_active?'active':'inactive'}">${x.is_active?'Active':'Inactive'}</span></td><td><div class="actions"><button onclick="editDepartment(${x.department_id})">Edit</button><button class="${x.is_active?'warn':'secondary'}" onclick="setStatus(${x.department_id},${!x.is_active})">${x.is_active?'Deactivate':'Activate'}</button><button class="danger" onclick="deleteDepartment(${x.department_id})">Delete</button></div></td></tr>`).join(""):'<tr><td colspan="6" class="empty-row">No departments found.</td></tr>'}catch(e){err(e.message)}}
function openForm(){editId=null;document.getElementById("title").textContent="Add Department";document.getElementById("form").reset();document.getElementById("code").disabled=false;document.getElementById("modal").classList.add("show")}function closeForm(){document.getElementById("modal").classList.remove("show")}
async function editDepartment(id){try{const d=await req("/api/departments/"+id),x=d.department;editId=id;document.getElementById("title").textContent="Edit Department";document.getElementById("code").value=x.department_code;document.getElementById("code").disabled=true;document.getElementById("name").value=x.department_name;document.getElementById("description").value=x.description||"";document.getElementById("modal").classList.add("show")}catch(e){err(e.message)}}
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();try{const data={departmentCode:String(document.getElementById("code").value||"").trim(),departmentName:String(document.getElementById("name").value||"").trim(),description:String(document.getElementById("description").value||"").trim()};if(editId){delete data.departmentCode;await req("/api/departments/"+editId,{method:"PUT",body:JSON.stringify(data)})}else await req("/api/departments",{method:"POST",body:JSON.stringify(data)});closeForm();await loadDepartments();}catch(e){err(e.message)}})
async function setStatus(id,active){try{await req("/api/departments/"+id+"/status",{method:"PATCH",body:JSON.stringify({isActive:active})});await loadDepartments()}catch(e){err(e.message)}}
async function deleteDepartment(id){if(!confirm("Delete this department? If it is used by students, faculty or courses, it will be kept and should be deactivated instead."))return;try{await req("/api/departments/"+id,{method:"DELETE"});await loadDepartments()}catch(e){err(e.message)}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
if(authOk())loadDepartments();
</script></body></html>
